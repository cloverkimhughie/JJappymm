<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Aim Trainer</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header><h1>Aim Trainer</h1><div class="stats"><span>점수 <b id="score">0</b></span><span>시간 <b id="time">30.0</b>s</span><span>명중 <b id="hits">0</b></span><span>빗나감 <b id="misses">0</b></span><span>명중률 <b id="accuracy">100</b>%</span><span>평균 <b id="avgReaction">-</b>ms</span></div></header>
<main id="arena">
  <div id="start">
    <h2>30초 에임 연습</h2>
    <p>타겟을 최대한 빠르게 클릭하세요.</p>
    <div id="result"></div>
    <button id="startBtn">시작</button>
    <div id="sensitivityPanel">
      <label for="sensitivity">감도 <b id="sensitivityValue">1.00</b></label>
      <input id="sensitivity" type="range" min="0.25" max="2.00" step="0.05" value="1.00">
      <p>낮게 설정하면 목표물이 천천히 이동하고, 높게 설정하면 빠르게 이동합니다.</p>
    </div>
  </div>
  <div id="target" hidden></div>
</main>
<script src="script.js"></script>
</body>
</html>
