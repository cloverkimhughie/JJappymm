<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Aim Trainer</title>
<link rel="stylesheet" href="style.css?v=20260919-2">
</head>
<body>
<header><h1>Aim Trainer</h1><div class="stats"><span>점수 <b id="score">0</b></span><span>시간 <b id="time">30.0</b>s</span><span>명중 <b id="hits">0</b></span><span>빗나감 <b id="misses">0</b></span><span>명중률 <b id="accuracy">100</b>%</span><span>평균 <b id="avgReaction">-</b>ms</span></div></header>
<main id="arena">
  <div id="start">
    <h2>30초 에임 연습</h2>
    <p>타겟을 최대한 빠르게 클릭하세요.</p>
    <div id="result"></div>
    <div id="timeSelector">
      <span>훈련 시간</span>
      <div class="timeButtons">
        <button type="button" class="timeBtn" data-time="15">15초</button>
        <button type="button" class="timeBtn selected" data-time="30">30초</button>
        <button type="button" class="timeBtn" data-time="60">60초</button>
        <button type="button" class="timeBtn" data-time="120">120초</button>
      </div>
      <div class="customTime">
        <button type="button" id="minusTime">−</button>
        <b id="selectedTime">30초</b>
        <button type="button" id="plusTime">+</button>
      </div>
    </div>
    <button id="startBtn">시작</button>
  </div>
  <div id="target" hidden></div><div id="crosshair" hidden></div>
</main>
<script src="script.js?v=20260919-2"></script>
</body>
</html>
